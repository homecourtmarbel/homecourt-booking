<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Our Courts</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="nav">
    <a href="/" class="nav-brand" id="facility-name">Court Booking</a>
    <div class="nav-links">
      <a href="/courts.html" class="nav-link">Courts</a>
      <span id="auth-nav" class="nav-links"></span>
    </div>
  </nav>

  <main class="container" style="padding-top: 40px;">
    <section class="card">
      <h2 id="facility-name-2">Our courts</h2>
      <p style="color: var(--muted);" id="facility-location-2"></p>

      <div class="info-grid">
        <div class="info-item"><b>Rate</b><span id="rate-info"></span></div>
        <div class="info-item"><b>Address</b><span id="address-info"></span></div>
        <div class="info-item"><b>Hours</b><span id="hours-info"></span></div>
      </div>

      <h3 style="margin-top: 28px;">Amenities</h3>
      <div class="info-grid" id="amenities"></div>

      <p style="margin-top: 28px;"><a href="/#" onclick="window.location.href='/'" style="color: var(--accent); font-weight: 600;">← Book a court</a></p>
    </section>
  </main>

  <script src="/js/auth.js"></script>
  <script>
    async function loadCourtsPage() {
      const res = await fetch("/api/config");
      const cfg = await res.json();
      document.getElementById("facility-name").textContent = cfg.facilityName;
      document.getElementById("facility-name-2").textContent = cfg.facilityName;
      document.getElementById("facility-location-2").textContent = cfg.location;
      document.getElementById("rate-info").textContent =
        cfg.pricing.currencySymbol + cfg.pricing.offPeakRate + "-" + cfg.pricing.currencySymbol + cfg.pricing.peakRate + " per hour · " + cfg.courts.length + " courts";
      document.getElementById("address-info").textContent = cfg.address;
      document.getElementById("hours-info").textContent = cfg.openHour + ":00 - " + cfg.closeHour + ":00 daily";
      document.getElementById("amenities").innerHTML = cfg.amenities
        .map((a) => `<div class="info-item">${a}</div>`)
        .join("");
    }
    document.addEventListener("DOMContentLoaded", loadCourtsPage);
  </script>
</body>
</html>
