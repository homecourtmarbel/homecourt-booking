<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="nav">
    <a href="/" class="nav-brand" id="facility-name">Court Booking</a>
    <div class="nav-links">
      <span id="auth-nav" class="nav-links"></span>
    </div>
  </nav>

  <form id="login-form" class="auth-form">
    <h2>Sign in</h2>
    <div class="form-error" id="form-error"></div>
    <input name="email" type="email" placeholder="Email" required />
    <input name="password" type="password" placeholder="Password" required />
    <button type="submit" class="primary">Sign in</button>
    <p class="form-switch">No account? <a href="/signup.html">Sign up</a></p>
  </form>

  <script src="/js/auth.js"></script>
  <script>
    handleAuthForm("login-form", "/api/auth/login");
    fetch("/api/config").then(r => r.json()).then(cfg => {
      document.getElementById("facility-name").textContent = cfg.facilityName;
    });
  </script>
</body>
</html>
