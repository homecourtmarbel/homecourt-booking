<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My bookings</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="nav">
    <a href="/" class="nav-brand" id="facility-name">Court Booking</a>
    <div class="nav-links">
      <a href="/courts.html" class="nav-link">Courts</a>
      <span id="auth-nav" class="nav-links"></span>
    </div>
  </nav>

  <main class="container" style="padding-top: 40px;">
    <section class="card">
      <h2>My bookings</h2>
      <div id="bookings-list"></div>
    </section>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/bookings.js"></script>
  <script>
    fetch("/api/config").then(r => r.json()).then(cfg => {
      document.getElementById("facility-name").textContent = cfg.facilityName;
    });
  </script>
</body>
</html>
