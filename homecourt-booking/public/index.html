<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Court Booking</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="nav">
    <div class="nav-brand" id="facility-name">Court Booking</div>
    <div class="nav-links">
      <a href="/courts.html" class="nav-link">Courts</a>
      <a href="/bookings.html" class="nav-link">My bookings</a>
    </div>
  </nav>

  <header class="hero">
    <h1 id="facility-tagline">Play. Compete. Connect.</h1>
    <p class="tagline" id="facility-location">Your City, Your Country</p>
    <p class="rate" id="from-rate">From $250/hr</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>Reserve your court</h2>
      <p style="color: var(--muted); margin-top: -8px;">Pick a date, tap the open slots you want, and confirm. No account needed.</p>

      <div class="date-scroller" id="date-scroller"></div>

      <table id="slot-grid"></table>

      <div class="summary-bar">
        <span id="summary">Tap open slots to select them</span>
        <button id="book-btn" class="primary" disabled>Book selected slots</button>
      </div>
    </section>
  </main>

  <div id="modal-overlay" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <h3 id="modal-step-title">Almost done</h3>
      <div class="form-error" id="modal-error"></div>

      <div id="modal-step-details">
        <p style="color: var(--muted); margin-top: -6px;">Just your name and phone number - no account needed.</p>

        <label>Name</label>
        <div class="name-row">
          <input id="modal-first-name" type="text" placeholder="First name" autocomplete="given-name" />
          <input id="modal-last-name" type="text" placeholder="Last name" autocomplete="family-name" />
        </div>

        <label>Phone number</label>
        <div class="phone-row">
          <select id="modal-country-code" aria-label="Country code">
            <option value="63" selected>🇵🇭 +63</option>
            <option value="1">🇺🇸 +1</option>
            <option value="1">🇨🇦 +1</option>
            <option value="44">🇬🇧 +44</option>
            <option value="61">🇦🇺 +61</option>
            <option value="65">🇸🇬 +65</option>
            <option value="60">🇲🇾 +60</option>
            <option value="852">🇭🇰 +852</option>
            <option value="971">🇦🇪 +971</option>
            <option value="966">🇸🇦 +966</option>
            <option value="81">🇯🇵 +81</option>
            <option value="82">🇰🇷 +82</option>
            <option value="86">🇨🇳 +86</option>
            <option value="91">🇮🇳 +91</option>
          </select>
          <input id="modal-phone" type="tel" placeholder="9171234567" autocomplete="tel-national" />
        </div>

        <div style="display:flex; gap:10px; margin-top:8px;">
          <button id="modal-cancel" class="cancel-btn" style="flex:1;">Cancel</button>
          <button id="modal-next" class="primary" style="flex:1;">Next: Payment</button>
        </div>
      </div>

      <div id="modal-step-payment" style="display:none;">
        <p style="color: var(--muted); margin-top: -6px;" id="pay-amount"></p>
        <div class="qr-frame">
          <img id="pay-qr" src="" alt="Payment QR code" />
        </div>
        <p style="font-size:1rem;">
          <b id="pay-method"></b> · <span id="pay-account-name"></span><br/>
          <span id="pay-account-number" style="color: var(--accent); font-weight:600;"></span>
        </p>
        <p style="color: var(--muted); font-size: 0.9rem;" id="pay-instructions"></p>
        <label>Upload your payment receipt/screenshot</label>
        <input id="modal-receipt" type="file" accept="image/*" />
        <div style="display:flex; gap:10px; margin-top:8px;">
          <button id="modal-back" class="cancel-btn" style="flex:1;">Back</button>
          <button id="modal-confirm" class="primary" style="flex:1;">Confirm booking</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/calendar.js"></script>
</body>
</html>
