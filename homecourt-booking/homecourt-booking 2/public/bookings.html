<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My bookings</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="nav">
    <a href="/" class="nav-brand" id="facility-name">Court Booking</a>
    <div class="nav-links">
      <a href="/courts.html" class="nav-link">Courts</a>
      <a href="/bookings.html" class="nav-link">My bookings</a>
    </div>
  </nav>

  <main class="container" style="padding-top: 40px;">
    <section class="card">
      <h2>My bookings</h2>
      <p style="color: var(--muted); margin-top: -8px;">No account needed - just enter the phone number you booked with.</p>

      <div style="display:flex; gap:10px; max-width:420px; margin: 16px 0;">
        <input id="phone-input" type="tel" placeholder="Phone number" style="flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background: var(--panel-2); color: var(--text);" />
        <button id="lookup-btn" class="primary">Find</button>
      </div>

      <div id="bookings-list"></div>
    </section>
  </main>

  <script src="/js/bookings.js"></script>
  <script>
    fetch("/api/config").then(r => r.json()).then(cfg => {
      document.getElementById("facility-name").textContent = cfg.facilityName;
    });
  </script>
</body>
</html>
